[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "env-contract-kit"
version = "0.1.0"
description = "Catch invalid deployment settings without printing their values."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]
dependencies = []

[project.scripts]
env-contract-kit = "env_contract_kit:main"

[tool.setuptools]
py-modules = ["env_contract_kit"]
